<div *ngIf="PollDataTopic?.pollData?.[0]?.options?.length">
  <div
    *ngFor="let option of PollDataTopic.pollData[0].options"
    (click)="
      onPollOptionClicked(
        $event,
        option.id,
        PollDataTopic.userData.id,
        PollDataTopic.id
      )
    "
    [ngStyle]="{
      background: hasUserVoted && option.id === votedOptionId ? '#d1e7dd' : '#f8f9fa',
      border: '2px solid #dee2e6',
      padding: '10px',
      borderRadius: '6px',
      marginBottom: '10px',
      cursor: hasUserVoted ? 'default' : 'pointer',
      transition: 'background 0.3s ease'
    }"
  >
    <div style="font-weight: 600;">{{ option.optionText }}</div>

    <ng-container *ngIf="hasUserVoted">
      <div style="margin-top: 5px;">
        Votes: {{ option.voteCount }} ({{ votePercentages[option.id] }})
      </div>
      <div style="background: #e9ecef; height: 8px; border-radius: 4px; margin-top: 4px;">
        <div
          [style.width]="votePercentages[option.id]"
          style="background: #0d6efd; height: 100%; border-radius: 4px;"
        ></div>
      </div>
    </ng-container>
  </div>
</div>
